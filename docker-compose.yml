services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: walletuser
      POSTGRES_PASSWORD: walletpass
      POSTGRES_DB: wallet_toolbox_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walletuser -d wallet_toolbox_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    # Keep the image's strict default sql_mode, including ONLY_FULL_GROUP_BY.
    environment:
      MYSQL_ROOT_PASSWORD: walletpass
      MYSQL_DATABASE: wallet_toolbox_test
      MYSQL_USER: walletuser
      MYSQL_PASSWORD: walletpass
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uwalletuser -pwalletpass --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
