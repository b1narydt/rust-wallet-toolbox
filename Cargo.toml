[package]
name = "bsv-wallet-toolbox"
version = "0.9.0"
edition = "2021"
rust-version = "1.87"
description = "Pure Rust BSV wallet-toolbox implementation"
readme = "README.md"
repository = "https://github.com/b1narydt/rust-wallet-toolbox"
documentation = "https://docs.rs/bsv-wallet-toolbox"
keywords = ["bsv", "bitcoin", "blockchain", "wallet", "cryptography"]
categories = ["cryptography", "authentication"]
license-file = "LICENSE"

[lib]
name = "bsv_wallet_toolbox"

[dependencies]
bsv-sdk = { version = "0.6.0", features = ["network"] }
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "macros", "chrono", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
strum = { version = "0.26", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
reqwest-eventsource = "0.6"
futures = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
argon2 = "0.5"
unicode-normalization = "0.1"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"], optional = true }
url = { version = "2", optional = true }
# Pinned: home >=0.5.12 requires rustc 1.88; we target MSRV 1.87 per `rust-version` above.
home = "=0.5.11"

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
mysql = ["sqlx/mysql"]
postgres = ["sqlx/postgres"]
chaintracks-ws = ["dep:tokio-tungstenite", "dep:url"]

# Argon2id at the BRC-39 default cost (7 iterations over 128 MiB) is unusably
# slow unoptimized; keep the KDF fast in dev/test builds.
[profile.dev.package.argon2]
opt-level = 3

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
# Faucet funding for the funded conformance recorder (tests/record_funded_vectors.rs)
# only — dev-dependency so the toolbox gains no runtime dependency.
bsv-messagebox-client = "0.3.0"
